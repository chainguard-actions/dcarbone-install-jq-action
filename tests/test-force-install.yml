name: Test force jq install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare runner environment
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache

      - name: Ensure jq is pre-installed
        run: |
          apt-get install -y jq 2>/dev/null || true
          echo "Pre-installed jq version: $(jq --version 2>/dev/null || echo 'not found')"

      - id: action
        uses: .
        with:
          version: '1.7'
          force: 'true'

      - name: Assert installed output is true (force=true always means installed=true)
        env:
          INSTALLED: ${{ steps.action.outputs.installed }}
        run: |
          echo "installed: $INSTALLED"
          if [ "$INSTALLED" != "true" ]; then
            echo "FAIL: expected installed=true when force=true"
            exit 1
          fi
          echo "PASS"

      - name: Assert jq is available after force install
        run: |
          echo "Checking jq is available..."
          JQ_BIN=""
          if command -v jq >/dev/null 2>&1; then
            JQ_BIN="jq"
            echo "Found jq on PATH: $(which jq)"
          elif [ -f "/tmp/runner-tool-cache/jq/jq" ]; then
            JQ_BIN="/tmp/runner-tool-cache/jq/jq"
            echo "Found jq in tool cache"
          else
            echo "FAIL: jq not found on PATH or in tool cache after force install"
            exit 1
          fi
          echo "jq version: $($JQ_BIN --version)"
          echo "PASS: jq is installed"
